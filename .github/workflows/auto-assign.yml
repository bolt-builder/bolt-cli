name: Auto Assign
on:
  issues:
    types: [opened]
  # pull_request_target so the token keeps write permissions on fork PRs;
  # safe because this workflow never checks out or runs PR code.
  pull_request_target:
    types: [opened]
jobs:
  run:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: "Auto-assign issue"
        uses: pozil/auto-assign-issue@af6beea6bdf1e8eb373f061c5bc168681fc6d011 # v4.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: DevFlex-AI
          numOfAssignee: 1

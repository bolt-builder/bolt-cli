name: "Setup Git Committer"
description: "Create app token and configure git user"
inputs:
  opencode-app-id:
    description: "OpenCode GitHub App ID"
    required: true
  opencode-app-secret:
    description: "OpenCode GitHub App private key"
    required: true
  git-user-name:
    description: "Custom git user name (optional)"
    required: false
    default: ""
  git-user-email:
    description: "Custom git user email (optional)"
    required: false
    default: ""
outputs:
  token:
    description: "GitHub App token"
    value: ${{ steps.apptoken.outputs.token }}
  app-slug:
    description: "GitHub App slug"
    value: ${{ steps.apptoken.outputs.app-slug }}
runs:
  using: "composite"
  steps:
    - name: Create app token
      id: apptoken
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.opencode-app-id }}
        private-key: ${{ inputs.opencode-app-secret }}
        owner: ${{ github.repository_owner }}

    - name: Configure git user
      run: |
        slug="${{ steps.apptoken.outputs.app-slug }}"
        name="${{ inputs.git-user-name }}"
        email="${{ inputs.git-user-email }}"
        if [ -z "$name" ]; then
          name="${slug}[bot]"
        fi
        if [ -z "$email" ]; then
          email="${slug}[bot]@users.noreply.github.com"
        fi
        git config --global user.name "$name"
        git config --global user.email "$email"
      shell: bash

    - name: Clear checkout auth
      run: |
        git config --local --unset-all http.https://github.com/.extraheader || true
      shell: bash

    - name: Configure git remote
      run: |
        git remote set-url origin https://x-access-token:${{ steps.apptoken.outputs.token }}@github.com/${{ github.repository }}
      shell: bash
